name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Resolve dependencies and update lockfile
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: Generate collaboration service lockfile
        working-directory: collaboration
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles and trigger a clean CI run
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/pnpm-lock.yaml collaboration/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfile is already current."
            exit 0
          fi
          git commit -m "chore: update frontend dependency lockfile"
          git push origin "HEAD:${HEAD_BRANCH}"
          gh workflow run ci.yml --ref "${HEAD_BRANCH}"

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codebreak
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codebreak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/codebreak
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ci-only-secret-key-must-be-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B test

  collaboration:
    name: Yjs CRDT collaboration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collaboration/package-lock.json
      - run: npm ci --prefix collaboration
      - run: npm test --prefix collaboration
      - run: node --check collaboration/server.js

  containers:
    name: Docker Compose stack smoke test
    runs-on: ubuntu-latest
    needs: [frontend, backend, collaboration]
    steps:
      - uses: actions/checkout@v4
      - name: Validate EC2 deployment scripts
        run: bash -n deploy/ec2-bootstrap.sh deploy/ec2-deploy.sh deploy/backup/restore-postgres.sh && sh -n deploy/backup/backup-loop.sh
      - name: Validate Compose configuration
        run: docker compose --env-file backend/.env.example -f backend/docker-compose.yml config --quiet
      - name: Build and start complete stack
        run: docker compose --profile monitoring --profile backup --env-file backend/.env.example -f backend/docker-compose.yml up -d --build
      - name: Verify frontend becomes reachable
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost/ >/dev/null; then
              echo "Frontend is responding."
              exit 0
            fi
            sleep 5
          done
          docker compose --profile monitoring --profile backup --env-file backend/.env.example -f backend/docker-compose.yml ps
          docker compose --profile monitoring --profile backup --env-file backend/.env.example -f backend/docker-compose.yml logs --tail=100
          exit 1
      - name: Stop stack
        if: always()
        run: docker compose --profile monitoring --profile backup --env-file backend/.env.example -f backend/docker-compose.yml down -v
