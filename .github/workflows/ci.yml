name: CI

on:
  push:
    branches:
      - production/foundation
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Smoke-test full local stack
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'docker compose -f docker-compose.yml -f docker-compose.app.yml down -v || true; rm -f .env' EXIT
          docker compose -f docker-compose.yml -f docker-compose.app.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.app.yml build backend frontend
          if ! docker compose -f docker-compose.yml -f docker-compose.app.yml up -d; then
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            exit 1
          fi

          ready=false
          for attempt in $(seq 1 40); do
            if curl --silent --show-error --fail http://localhost:5173/ >/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done

          if [ "$ready" != "true" ]; then
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            exit 1
          fi

          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            -X POST http://localhost:5173/api/auth/login \
            -H "Content-Type: application/json" \
            --data '{"username":"missing-user","password":"not-a-real-password"}')

          if [ "$status" != "401" ]; then
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            echo "Expected login smoke test to return 401, got $status"
            exit 1
          fi

      - name: Run tests
        run: mvn -B test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
