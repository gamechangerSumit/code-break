name: CI

on:
  push:
    branches:
      - production/foundation
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Smoke-test full local stack
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef/' .env
          trap 'docker compose -f docker-compose.yml -f docker-compose.app.yml down -v || true; rm -f .env' EXIT
          docker compose -f docker-compose.yml -f docker-compose.app.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.app.yml build backend frontend
          if ! docker compose -f docker-compose.yml -f docker-compose.app.yml up -d; then
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            exit 1
          fi

          ready=false
          for attempt in $(seq 1 40); do
            if curl --silent --show-error --fail http://localhost:5173/ >/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done

          if [ "$ready" != "true" ]; then
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            exit 1
          fi

          base_url=http://localhost:5173/api
          smoke_user="ci${GITHUB_RUN_ID}"
          smoke_email="ci-${GITHUB_RUN_ID}@example.test"
          smoke_password="CodeBreak-smoke-2026!"

          unauthenticated_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            "$base_url/projects")
          if [ "$unauthenticated_status" != "401" ]; then
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            echo "Expected unauthenticated project request to return 401, got $unauthenticated_status"
            exit 1
          fi

          registration=$(jq -n --arg username "$smoke_user" --arg email "$smoke_email" --arg password "$smoke_password" \
            '{username:$username,email:$email,password:$password}')
          registration_status=$(curl --silent --show-error --output /tmp/codebreak-registration.json --write-out "%{http_code}" \
            -X POST "$base_url/auth/register" -H "Content-Type: application/json" --data "$registration")
          if [ "$registration_status" != "201" ]; then
            cat /tmp/codebreak-registration.json
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            echo "Expected registration to return 201, got $registration_status"
            exit 1
          fi

          login_payload=$(jq -n --arg username "$smoke_user" --arg password "$smoke_password" \
            '{username:$username,password:$password}')
          login_status=$(curl --silent --show-error --output /tmp/codebreak-login.json --write-out "%{http_code}" \
            -X POST "$base_url/auth/login" -H "Content-Type: application/json" --data "$login_payload")
          if [ "$login_status" != "200" ]; then
            cat /tmp/codebreak-login.json
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            echo "Expected login to return 200, got $login_status"
            exit 1
          fi
          token=$(jq -er '.token | select(type == "string" and length > 0)' /tmp/codebreak-login.json)

          project_payload='{"name":"CI smoke project","description":"Disposable end-to-end smoke test"}'
          project_status=$(curl --silent --show-error --output /tmp/codebreak-project.json --write-out "%{http_code}" \
            -X POST "$base_url/projects" -H "Content-Type: application/json" \
            -H "Authorization: Bearer $token" --data "$project_payload")
          if [ "$project_status" != "201" ]; then
            cat /tmp/codebreak-project.json
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            echo "Expected authenticated project creation to return 201, got $project_status"
            exit 1
          fi
          jq -e '.id and .joinCode and .name == "CI smoke project"' /tmp/codebreak-project.json >/dev/null

          projects_status=$(curl --silent --show-error --output /tmp/codebreak-projects.json --write-out "%{http_code}" \
            "$base_url/projects" -H "Authorization: Bearer $token")
          if [ "$projects_status" != "200" ]; then
            cat /tmp/codebreak-projects.json
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            echo "Expected authenticated project listing to return 200, got $projects_status"
            exit 1
          fi
          jq -e 'any(.[]; .name == "CI smoke project")' /tmp/codebreak-projects.json >/dev/null

          project_id=$(jq -er '.id | select(type == "number")' /tmp/codebreak-project.json)
          workspace_path="src/Main.java"
          workspace_content='public class Main { public static void main(String[] args) { System.out.println("hello"); } }'
          workspace_payload=$(jq -n --arg path "$workspace_path" --arg content "$workspace_content" \
            '{path:$path,content:$content}')
          workspace_save_status=$(curl --silent --show-error --output /tmp/codebreak-workspace-save.json --write-out "%{http_code}" \
            -X PUT "$base_url/projects/$project_id/workspace/file" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $token" --data "$workspace_payload")
          if [ "$workspace_save_status" != "200" ]; then
            cat /tmp/codebreak-workspace-save.json
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            echo "Expected workspace file save to return 200, got $workspace_save_status"
            exit 1
          fi

          workspace_read_status=$(curl --silent --show-error --output /tmp/codebreak-workspace-read.txt --write-out "%{http_code}" \
            --get --data-urlencode "path=$workspace_path" "$base_url/projects/$project_id/workspace/file" \
            -H "Authorization: Bearer $token")
          if [ "$workspace_read_status" != "200" ]; then
            cat /tmp/codebreak-workspace-read.txt
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            echo "Expected workspace file read to return 200, got $workspace_read_status"
            exit 1
          fi
          if [ "$(cat /tmp/codebreak-workspace-read.txt)" != "$workspace_content" ]; then
            echo "Workspace file content did not round-trip correctly"
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            exit 1
          fi

          collaborator_user="ci-member${GITHUB_RUN_ID}"
          collaborator_email="ci-member-${GITHUB_RUN_ID}@example.test"
          collaborator_registration=$(jq -n --arg username "$collaborator_user" --arg email "$collaborator_email" --arg password "$smoke_password" \
            '{username:$username,email:$email,password:$password}')
          collaborator_registration_status=$(curl --silent --show-error --output /tmp/codebreak-member-registration.json --write-out "%{http_code}" \
            -X POST "$base_url/auth/register" -H "Content-Type: application/json" --data "$collaborator_registration")
          if [ "$collaborator_registration_status" != "201" ]; then
            cat /tmp/codebreak-member-registration.json
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            echo "Expected collaborator registration to return 201, got $collaborator_registration_status"
            exit 1
          fi

          collaborator_login=$(jq -n --arg username "$collaborator_user" --arg password "$smoke_password" \
            '{username:$username,password:$password}')
          collaborator_login_status=$(curl --silent --show-error --output /tmp/codebreak-member-login.json --write-out "%{http_code}" \
            -X POST "$base_url/auth/login" -H "Content-Type: application/json" --data "$collaborator_login")
          if [ "$collaborator_login_status" != "200" ]; then
            cat /tmp/codebreak-member-login.json
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            echo "Expected collaborator login to return 200, got $collaborator_login_status"
            exit 1
          fi
          collaborator_token=$(jq -er '.token | select(type == "string" and length > 0)' /tmp/codebreak-member-login.json)

          join_code=$(jq -er '.joinCode | select(type == "string" and length > 0)' /tmp/codebreak-project.json)
          join_payload=$(jq -n --arg joinCode "$join_code" '{joinCode:$joinCode}')
          join_status=$(curl --silent --show-error --output /tmp/codebreak-member-join.json --write-out "%{http_code}" \
            -X POST "$base_url/projects/join" -H "Content-Type: application/json" \
            -H "Authorization: Bearer $collaborator_token" --data "$join_payload")
          if [ "$join_status" != "201" ]; then
            cat /tmp/codebreak-member-join.json
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            echo "Expected collaborator join to return 201, got $join_status"
            exit 1
          fi
          jq -e --arg username "$collaborator_user" '.username == $username and .role == "VIEWER"' /tmp/codebreak-member-join.json >/dev/null

          viewer_write_status=$(curl --silent --show-error --output /tmp/codebreak-viewer-write.json --write-out "%{http_code}" \
            -X PUT "$base_url/projects/$project_id/workspace/file" \
            -H "Content-Type: application/json" -H "Authorization: Bearer $collaborator_token" --data "$workspace_payload")
          if [ "$viewer_write_status" != "403" ]; then
            cat /tmp/codebreak-viewer-write.json
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            echo "Expected viewer workspace write to return 403, got $viewer_write_status"
            exit 1
          fi

          invalid_login_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            -X POST "$base_url/auth/login" -H "Content-Type: application/json" \
            --data '{"username":"missing-user","password":"not-a-real-password"}')
          if [ "$invalid_login_status" != "401" ]; then
            docker compose -f docker-compose.yml -f docker-compose.app.yml logs --no-color
            echo "Expected invalid login to return 401, got $invalid_login_status"
            exit 1
          fi

      - name: Run tests
        run: mvn -B test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
