name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codebreak
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codebreak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/codebreak
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ci-only-secret-key-must-be-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B test

  containers:
    name: Docker Compose stack smoke test
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment and backup scripts
        run: bash -n deploy/ec2-bootstrap.sh deploy/ec2-deploy.sh deploy/backup.sh deploy/restore-postgres.sh
      - name: Validate Compose configuration
        run: docker compose --env-file backend/.env.example -f backend/docker-compose.yml config --quiet
      - name: Build and start complete stack
        run: docker compose --env-file backend/.env.example -f backend/docker-compose.yml up -d --build
      - name: Verify backend readiness and HTTPS frontend
        run: |
          for attempt in $(seq 1 60); do
            if docker compose --env-file backend/.env.example -f backend/docker-compose.yml exec -T backend curl --fail --silent http://127.0.0.1:8088/actuator/health/readiness >/dev/null && curl --insecure --fail --silent https://localhost/ >/dev/null; then
              echo "Backend readiness and HTTPS frontend are responding."
              exit 0
            fi
            sleep 5
          done
          docker compose --env-file backend/.env.example -f backend/docker-compose.yml ps
          docker compose --env-file backend/.env.example -f backend/docker-compose.yml logs --tail=100
          exit 1
      - name: Stop stack
        if: always()
        run: docker compose --env-file backend/.env.example -f backend/docker-compose.yml down -v
