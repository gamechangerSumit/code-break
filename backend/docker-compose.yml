services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codebreak
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://rustfs:9000
      MINIO_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in backend/.env}
      MINIO_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-}
      CODE_RUNNER_API_KEY: ${CODE_RUNNER_API_KEY:-}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set APP_CORS_ALLOWED_ORIGINS in backend/.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    expose:
      - "8088"
    networks:
      - app-internal
      - data-internal

  collaboration:
    build:
      context: ../collaboration
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 1234
      REDIS_URL: redis://redis:6379
      BACKEND_INTERNAL_URL: http://backend:8088
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    expose:
      - "1234"
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('node:net').connect(1234,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-internal
      - data-internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in backend/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - codebreak_caddy_data:/data
      - codebreak_caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      collaboration:
        condition: service_healthy
    networks:
      - app-internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: codebreak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - codebreak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codebreak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - codebreak_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - data-internal

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in backend/.env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in backend/.env}
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - codebreak_rustfs_data:/data
    command: ["/data"]
    networks:
      - data-internal
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - codebreak_prometheus_data:/prometheus
    depends_on:
      - backend
    networks:
      - app-internal

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in backend/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - codebreak_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-internal

  backup:
    build:
      context: ../deploy/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["backup"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in backend/.env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in backend/.env}
    volumes:
      - codebreak_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    networks:
      - data-internal


volumes:
  codebreak_postgres_data:
  codebreak_redis_data:
  codebreak_rustfs_data:
  codebreak_caddy_data:
  codebreak_caddy_config:
  codebreak_prometheus_data:
  codebreak_grafana_data:
  codebreak_backups:

networks:
  app-internal:
  data-internal:
    internal: true
