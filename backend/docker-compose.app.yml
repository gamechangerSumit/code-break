services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8088"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codebreak}
      DATABASE_USERNAME: ${POSTGRES_USER:-codebreak}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in backend/.env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in backend/.env}
      MINIO_BUCKET: ${MINIO_BUCKET:-codebreak}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      CORS_ALLOWED_ORIGINS: ${APP_ORIGIN:-http://localhost:5173}
      WEBSOCKET_ALLOWED_ORIGINS: ${APP_ORIGIN:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8088/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:5173/ws}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
