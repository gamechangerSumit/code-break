services:

  redis:
    image: redis:7-alpine
    container_name: codebreak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - codebreak_redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: codebreak-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - codebreak_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  codebreak_redis_data:
  codebreak_minio_data: