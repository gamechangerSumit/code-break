spring.application.name=code-break-backend

server.port=8088


# =========================================================
# POSTGRESQL
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/codebreak
spring.datasource.username=postgres
spring.datasource.password=rock
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379


# =========================================================
# MINIO
# =========================================================

minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=codebreak


# =========================================================
# JWT
# =========================================================

jwt.secret=change-this-to-a-long-random-secret-key-for-code-break