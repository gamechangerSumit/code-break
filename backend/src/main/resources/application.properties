spring.application.name=code-break-backend
server.port=${SERVER_PORT:8088}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codebreak}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# S3-compatible object storage (RustFS in the Compose stack)
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:codebreak}

# Required in every environment; set a random 32+ byte value.
jwt.secret=${JWT_SECRET}

# Comma-separated exact frontend origins.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Optional AI coding assistant provider
app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com}
app.ai.model=${AI_MODEL:gpt-4.1-mini}

# Optional isolated Judge0-compatible code runner (keep this endpoint private)
app.execution.base-url=${CODE_RUNNER_URL:}
app.execution.api-key=${CODE_RUNNER_API_KEY:}

# Optional GitHub integration; AES-256 key must be base64-encoded 32 random bytes.
app.github.encryption-key=${GITHUB_TOKEN_ENCRYPTION_KEY:}

# Operational health and Prometheus metrics (backend is only reachable on internal Docker networks)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.prometheus.metrics.export.enabled=true
